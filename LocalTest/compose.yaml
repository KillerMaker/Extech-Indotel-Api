name: indotel-local-test
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: indotel-local-test-api:local
    restart: unless-stopped
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes: [sql_data:/var/opt/mssql]
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 36
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: "0:0"
    entrypoint: [/opt/mssql-tools18/bin/sqlcmd]
    command: [-S, sqlserver, -U, sa, -C, -b, -x, -i, /run/sql/init.sql]
    volumes: [./.runtime/sql-init.sql:/run/sql/init.sql:ro]
  redis:
    image: redis:7-alpine
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 12
  kafka:
    image: apache/kafka:4.2.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:19092, --list]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 18
  kafka-init:
    image: apache/kafka:4.2.1
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command: [--bootstrap-server, kafka:19092, --create, --if-not-exists, --topic, email.requests.local-test, --partitions, "1", --replication-factor, "1"]
volumes:
  sql_data:
  redis_data:
  kafka_data:
